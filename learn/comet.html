const COLORS=['#ff4f6d','#ff8a2f','#ffc72c','#8ad43c','#1fbf9b','#2f9bff','#2f5bff','#8a5bff','#ff7ac8','#8b5a3c','#1b2236','#ffffff','#9aa5b8','#ffd9b3','#7dd3fc','#bbf7d0'];
function paintView(p){
  const free=p.id==='free',key='sp:'+p.id;
  
  app.innerHTML=`<p><a href="${R}${free?'index.html':'c/'+p.c+'.html'}">← Back</a></p><h1>${p.t} colouring page</h1>${free?'':`<p><a href="${R}learn/${p.id}.html">Learn to draw ${p.t.toLowerCase()} step by step</a></p>`}
  <div class="stage">
  <div class="panel tools" role="toolbar" aria-label="Tools">${free?'':'<button class="t" data-t="fill">Fill</button>'}<button class="t" data-t="brush">Brush</button><button class="t" data-t="rainbow">Rainbow</button><button class="t" data-t="spray">Spray</button><button class="t" data-t="eraser">Eraser</button></div>
  <section><div class="board"><canvas id="paint" aria-label="Colouring canvas"></canvas><canvas id="over" aria-hidden="true"></canvas></div>
  <div class="controls"><div class="swatches" id="sw" role="group" aria-label="Colours"></div>
  <label>Custom <input type="color" id="cu" value="#ff5c7a"></label>
  <label>Size <input type="range" id="sz" min="2" max="60"></label>
  <label class="ao">Opacity <input type="range" id="al" min="10" max="100" value="100"></label>
  <label class="ao"><input type="checkbox" id="mi"> Mirror</label></div>
  <div class="actions"><button id="un">Undo</button><button id="cl">Clear</button>${free?'':'<button id="pr">Print outline</button>'}<button id="sv" class="go">Save picture</button></div></section>
  <aside><div class="ad ad-side" data-slot="side"></div></aside></div>`;
  const paint=$('#paint'),over=$('#over'),c=paint.getContext('2d',{willReadFrequently:true}),o=over.getContext('2d',{willReadFrequently:true});
  paint.width=over.width=W;paint.height=over.height=H;
  const S=window.S=window.S||{};Object.assign(S,{tool:free?'brush':'fill',color:S.color||'#ff5c7a',size:adult()?6:16,alpha:1,mirror:false,hue:0});
  $('#sz').value=S.size;$('#cu').value=S.color;
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(p.d){o.lineWidth=p.c==='mandalas'?3.5:6;o.lineJoin=o.lineCap='round';o.strokeStyle='#1b2236';const q=new Path2D(p.d);o.stroke(q);
    if(p.s){o.save();o.translate(W,0);o.scale(-1,1);o.stroke(q);o.restore()}}
  const sv=ls.get(key);if(sv){const im=new Image();im.onload=()=>c.drawImage(im,0,0);im.src=sv}
  const U=[],snap=()=>{U.push(c.getImageData(0,0,W,H));if(U.length>20)U.shift()},store=()=>ls.set(key,paint.toDataURL());
  const undo=window.UNDO=()=>{const s=U.pop();if(s){c.putImageData(s,0,0);store()}};
  const pos=e=>{const r=paint.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  const line=(a,b,x,y)=>{c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()};
  function seg(a,b,x,y){c.lineCap=c.lineJoin='round';c.lineWidth=S.size;c.globalAlpha=S.alpha;
    if(S.tool==='eraser'){c.strokeStyle='#fff';c.globalAlpha=1}
    else if(S.tool==='rainbow'){S.hue=(S.hue+5)%360;c.strokeStyle='hsl('+S.hue+' 90% 55%)';c.globalAlpha=1}
    else c.strokeStyle=S.color;
    line(a,b,x,y);if(S.mirror)line(W-a,b,W-x,y);c.globalAlpha=1}
  function spray(x,y){c.fillStyle=S.color;c.globalAlpha=S.alpha*.6;
    for(let i=0;i<S.size*1.5;i++){const a=Math.random()*6.283,r=Math.random()*S.size*2,dx=Math.cos(a)*r,dy=Math.sin(a)*r;c.fillRect(x+dx,y+dy,1.8,1.8);if(S.mirror)c.fillRect(W-x-dx,y+dy,1.8,1.8)}
    c.globalAlpha=1}
  function fill(sx,sy){
    const od=o.getImageData(0,0,W,H).data,im=c.getImageData(0,0,W,H),pd=im.data,n=W*H,i0=sy*W+sx;
    if(od[i0*4+3]>14)return;
    const v=parseInt(S.color.slice(1),16),r=v>>16&255,g=v>>8&255,b=v&255,seen=new Uint8Array(n),st=[i0];seen[i0]=1;
    const add=j=>{if(!seen[j]&&od[j*4+3]<=14){seen[j]=1;st.push(j)}};
    while(st.length){const i=st.pop(),x=i%W,q=i*4;pd[q]=r;pd[q+1]=g;pd[q+2]=b;pd[q+3]=255;
      if(x>0)add(i-1);if(x<W-1)add(i+1);if(i>=W)add(i-W);if(i<n-W)add(i+W)}
    c.putImageData(im,0,0)}
  let last=null;
  paint.onpointerdown=e=>{paint.setPointerCapture(e.pointerId);snap();const[x,y]=pos(e);
    if(S.tool==='fill'){fill(x|0,y|0);store();return}
    last=[x,y];S.tool==='spray'?spray(x,y):seg(x,y,x+.01,y+.01)};
  paint.onpointermove=e=>{if(!last)return;const[x,y]=pos(e);S.tool==='spray'?spray(x,y):seg(last[0],last[1],x,y);last=[x,y]};
  paint.onpointerup=paint.onpointercancel=()=>{if(last)store();last=null};
  const tool=t=>{S.tool=t;document.querySelectorAll('button.t').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))};
  tool(S.tool);document.querySelector('.tools').onclick=e=>{if(e.target.dataset.t)tool(e.target.dataset.t)};
  const sw=$('#sw'),setC=col=>{S.color=col;$('#cu').value=col;if(S.tool==='eraser'||S.tool==='rainbow')tool(free?'brush':'fill');
    sw.querySelectorAll('.sw').forEach((b,i)=>b.setAttribute('aria-pressed',COLORS[i]===col))};
  COLORS.forEach(col=>{const b=document.createElement('button');b.className='sw';b.style.background=col;b.setAttribute('aria-label','Colour '+col);b.onclick=()=>setC(col);sw.appendChild(b)});
  setC(S.color);$('#cu').oninput=e=>setC(e.target.value);
  $('#sz').oninput=e=>S.size=+e.target.value;$('#al').oninput=e=>S.alpha=e.target.value/100;$('#mi').onchange=e=>S.mirror=e.target.checked;
  const comp=pa=>{const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);if(pa)x.drawImage(paint,0,0);x.drawImage(over,0,0);return t};
  $('#un').onclick=undo;
  $('#cl').onclick=()=>{if(confirm('Clear your picture?')){snap();c.fillStyle='#fff';c.fillRect(0,0,W,H);store()}};
  $('#sv').onclick=()=>{const a=document.createElement('a');a.download=p.id+'.png';a.href=comp(true).toDataURL();a.click()};
  if(!free)$('#pr').onclick=()=>{const w=open('');if(!w)return;w.document.write('<title>'+p.t+'</title><img src="'+comp(false).toDataURL()+'" style="width:100%">');w.document.close();w.onload=()=>w.print()};
}

/* ===== Draw-along lessons ===== */
function lessons(){
  app.innerHTML=`<h1>Draw along lessons</h1><p class="lead">Follow the steps and draw on your own canvas. Each lesson takes a few minutes.</p><div class="ad ad-top" data-slot="top"></div><div class="grid">${PG.filter(p=>adult()||CATS[p.c][1]).map(p=>`<a class="card" href="${R}learn/${p.id}.html">${thumb(p)}<b>Draw ${p.t}</b></a>`).join('')}</div>`;
}
function lesson(p){
  const parts=p.d.split(/(?=M)/),n=Math.min(6,parts.length),sz=Math.ceil(parts.length/n),N=Math.ceil(parts.length/sz);let k=1;
  app.innerHTML=`<p><a href="${R}learn.html">← All lessons</a></p><h1>Draw ${p.t} step by step</h1><div class="ad ad-top" data-slot="top"></div>
  <div class="two"><div class="panel"><svg id="gd" class="gd" viewBox="0 0 900 600" role="img" aria-label="Drawing guide"></svg><p id="st"></p><div class="actions"><button id="pv">Back</button><button id="nx" class="go">Next step</button></div></div>
  <div class="panel"><div class="board"><canvas id="lc" aria-label="Your drawing"></canvas></div><div class="actions"><button id="lx">Clear</button><a href="${R}p/${p.id}.html">Colour this picture</a></div></div></div>
  <article><h2>How to draw ${p.t.toLowerCase()}</h2><p>The pink lines in the guide show the new step. The grey lines show what you have already drawn. Copy each step on your canvas, then press Next step.</p></article>`;
  const m=d=>`<path d="${d}"/>`+(p.s?`<path transform="translate(900) scale(-1 1)" d="${d}"/>`:'');
  const show=()=>{$('#gd').innerHTML=`<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"><g stroke="#aab3c5">${m(parts.slice(0,(k-1)*sz).join(''))}</g><g stroke="#ff5c7a">${m(parts.slice((k-1)*sz,k*sz).join(''))}</g></g>`;
    $('#st').textContent='Step '+k+' of '+N;$('#pv').disabled=k<2;$('#nx').disabled=k>=N};
  $('#pv').onclick=()=>{k--;show()};$('#nx').onclick=()=>{k++;show()};show();
  const lc=$('#lc'),x=lc.getContext('2d'),q=e=>{const r=lc.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  lc.width=W;lc.height=H;
  const clr=()=>{x.fillStyle='#fff';x.fillRect(0,0,W,H);x.lineWidth=8;x.lineCap=x.lineJoin='round';x.strokeStyle='#1b2236'};clr();
  let l=null;
  lc.onpointerdown=e=>{lc.setPointerCapture(e.pointerId);l=q(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(l[0]+.1,l[1]);x.stroke()};
  lc.onpointermove=e=>{if(!l)return;const a=q(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(a[0],a[1]);x.stroke();l=a};
  lc.onpointerup=lc.onpointercancel=()=>{l=null};
  $('#lx').onclick=clr;
}

/* ===== Page boot (each page is a real URL made by build.js) ===== */
function render(){
  const v=B.v;
  if(v==='c')cat(B.k);
  else if(v==='p')paintView(B.id==='free'?FREE:PG.find(x=>x.id===B.id));
  else if(v==='info')info(B.k);
  else if(v==='learn')lessons();
  else if(v==='lesson')lesson(PG.find(x=>x.id===B.id));
  else home();
  ads();
}
function setMode(m){document.body.dataset.mode=m;ls.set('sp-mode',m);$('#mk').setAttribute('aria-pressed',m==='kids');$('#ma').setAttribute('aria-pressed',m==='adult');render()}
$('#mk').onclick=()=>setMode('kids');$('#ma').onclick=()=>setMode('adult');
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&window.UNDO){e.preventDefault();window.UNDO()}});
$('#cy').onclick=()=>{ls.set('sp-consent','yes');$('#cb').hidden=true;ads()};
$('#cn').onclick=()=>{ls.set('sp-consent','no');$('#cb').hidden=true};
$('#cs').onclick=e=>{e.preventDefault();$('#cb').hidden=false};
if(ADS.needConsent&&!ls.get('sp-consent'))$('#cb').hidden=false;
setMode(ls.get('sp-mode')==='adult'?'adult':'kids');
</script>
</body>
</html>
